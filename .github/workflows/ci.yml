name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x, 26.x]
        include:
          - os: windows-latest
            node-version: 24.x
    runs-on: ${{ matrix.os }}
    env:
      DEBUG_CLI_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Node >= 25 no longer bundles corepack, so install the pinned Yarn classic explicitly
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn ci-pipeline
      - name: Smoke test the compiled CLI
        run: node lib/cli/index.js --help
